<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Forms</title>
  </head>
  <body>
    <form
      name="stop-super-speeders-endorsement"
      method="POST"
      data-netlify="true"
      hidden
    >
      <input type="hidden" name="form-name" value="stop-super-speeders-endorsement" />

      <input type="text" name="organization-name" />
      <input type="url" name="organization-website" />
      <input type="text" name="first-name" />
      <input type="text" name="last-name" />
      <input type="text" name="title-role" />
      <input type="email" name="email" />

      <input type="checkbox" name="authorized-representative" />
      <input type="checkbox" name="endorses-statement" />
      <input type="checkbox" name="public-listing-permission" />

      <textarea name="comments"></textarea>
    </form>
  </body>
</html>
